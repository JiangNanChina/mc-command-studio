name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Electron runtime
        run: pnpm setup:electron

      - name: Build data pack
        run: pnpm data:build

      - name: Verify data packs and version compatibility
        run: pnpm data:verify

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build Windows installer (signed when secrets are configured)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: pnpm build:win

      - name: Verify bundled runtime dependencies
        run: pnpm check:runtime

      - name: Packaged Electron smoke
        env:
          MCSTUDIO_E2E_EXE: release/win-unpacked/MC Command Studio.exe
        run: node tools/e2e/smoke.mjs

      - name: Packaged persistence and version workflow regression
        env:
          MCSTUDIO_E2E_EXE: release/win-unpacked/MC Command Studio.exe
        run: node tools/e2e/persistence-smoke.mjs

      - name: Packaged Chinese UI, item plans and template regression
        env:
          MCSTUDIO_E2E_EXE: release/win-unpacked/MC Command Studio.exe
          MCSTUDIO_E2E_EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          node tools/e2e/form-usability-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/e2e/chinese-first-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/e2e/legacy-groups-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/e2e/template-catalog-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify tag and artifacts
        run: node tools/release/verify-version.mjs "${{ github.ref_name }}"

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.yml', '.blockmap' -and $_.Name -ne 'builder-debug.yml' } |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content release/checksums.txt -Encoding utf8
          Get-Content release/checksums.txt

      - name: Extract release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          $md = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)"
          $match = [regex]::Match($md, $pattern)
          if (-not $match.Success) { throw "CHANGELOG.md 中找不到 $version 的条目" }
          $notes = $match.Groups[1].Value.Trim()
          $footer = "`n`n安装：MC-Command-Studio-Setup-$version.exe（安装版，支持自动更新）/ MC-Command-Studio-$version-portable.exe（便携版，请手动下载）`n`n校验：发布资产 checksums.txt（SHA-256）`n`n国内镜像：https://mcstudio-cn.oss-cn-chengdu.aliyuncs.com/mc-command-studio/updates/"
          Set-Content -Path release-notes.md -Value ($notes + $footer) -Encoding utf8
          Write-Host "release notes: $($notes.Length) chars"

      - name: Create draft release with update metadata
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release-notes.md
          files: |
            release/MC-Command-Studio-Setup-*.exe
            release/MC-Command-Studio-*-portable.exe
            release/latest.yml
            release/*.blockmap
            release/checksums.txt
