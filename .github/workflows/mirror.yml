name: Mirror to Aliyun OSS

# 把已正式发布的安装包同步到阿里云 OSS，作为国内更新源。
# 只在 release 从 draft 转为 published 后触发，避免用户提前看到未发布版本。
# 说明见 docs/21-cn-mirror-oss.md。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的 tag，例如 v0.7.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: oss-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      OSS_PREFIX: mc-command-studio/updates
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check required secrets
        shell: pwsh
        run: |
          $missing = @()
          foreach ($name in 'OSS_BUCKET', 'OSS_ENDPOINT', 'OSS_ACCESS_KEY_ID', 'OSS_ACCESS_KEY_SECRET') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              $missing += $name
            }
          }
          if ($missing.Count -gt 0) {
            throw "缺少 GitHub Secrets：$($missing -join ', ')。先在仓库 Settings → Secrets 里配置。"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAG)) { throw '没有拿到 tag' }
          Write-Host "即将同步 $env:TAG 到 oss://$env:OSS_BUCKET/$env:OSS_PREFIX"

      - name: Download release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # 不带 --pattern：发布资产就是 exe / blockmap / latest.yml / checksums，全量拉取最稳
          gh release download $env:TAG --dir dist --clobber
          Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize

      - name: Install ossutil
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ossutil.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'ossutil'
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-windows-amd64.zip' `
            -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem $dir -Recurse -Filter 'ossutil*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'ossutil 解压后未找到可执行文件' }
          $exe.DirectoryName | Out-File -Append $env:GITHUB_PATH -Encoding utf8
          & $exe.FullName --version

      - name: Upload to OSS
        shell: pwsh
        run: |
          $oss = @('-e', $env:OSS_ENDPOINT, '-i', $env:OSS_ACCESS_KEY_ID, '-k', $env:OSS_ACCESS_KEY_SECRET)
          $base = "oss://$env:OSS_BUCKET/$env:OSS_PREFIX"
          # 先传 exe / blockmap / checksums，最后再传 latest.yml，避免用户拿到半套更新。
          ossutil cp -r -f --exclude "latest.yml" @oss dist/ "$base/"
          ossutil cp -f @oss dist/latest.yml "$base/latest.yml"
          # 标准 HTTP 头必须用 set-meta（-f 跳过交互确认）
          ossutil set-meta "$base/latest.yml" "Cache-Control:no-cache#Content-Type:text/yaml" -f @oss

      - name: Verify mirror
        shell: pwsh
        run: |
          $oss = @('-e', $env:OSS_ENDPOINT, '-i', $env:OSS_ACCESS_KEY_ID, '-k', $env:OSS_ACCESS_KEY_SECRET)
          $base = "oss://$env:OSS_BUCKET/$env:OSS_PREFIX"
          $expected = "version: $($env:TAG.TrimStart('v'))"
          $text = (ossutil cat @oss "$base/latest.yml") -join "`n"
          if ($text -notmatch [regex]::Escape($expected)) {
            throw "latest.yml 版本与 tag 不一致（期望 $expected）：`n$text"
          }
          Write-Host '最新版元数据校验通过'
          ossutil ls @oss "$base/" | Select-Object -First 20
